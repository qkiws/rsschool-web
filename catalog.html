
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coffee Lab — Catalog</title>

    <link rel="icon" href="favicon/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
    <div class="container header__container">

        <a class="logo" href="index.html">
            Coffee Lab
        </a>

        <nav class="navigation">
            <ul class="navigation__list">
                <li class="navigation__item">
                    <a class="navigation__link" href="index.html#about">
                        About
                    </a>
                </li>

                <li class="navigation__item">
                    <a class="navigation__link" href="index.html#coffee">
                        Coffee
                    </a>
                </li>

                <li class="navigation__item">
                    <a class="navigation__link" href="index.html#advantages">
                        Advantages
                    </a>
                </li>

                <li class="navigation__item">
                    <a class="navigation__link" href="index.html#reviews">
                        Reviews
                    </a>
                </li>

                <li class="navigation__item">
                    <a class="navigation__link" href="catalog.html">
                        Catalog
                    </a>
                </li>
            </ul>
        </nav>

        <div class="header__actions">

            <button class="theme-button" type="button" aria-label="Change theme">
                ☀
            </button>

            <button class="burger-button" type="button" aria-label="Open menu">
                ☰
            </button>

        </div>

    </div>
</header>

<main>

    <section class="catalog">
        <div class="container">

            <div class="section-heading">

                <p class="section-heading__subtitle">
                    Our menu
                </p>

                <h1 class="section-heading__title">
                    Coffee Catalog
                </h1>

                <p class="section-heading__description">
                    Explore our selection of coffee, tea and desserts.
                </p>

            </div>

            <div class="catalog__categories">

                <button
                    class="category-button category-button--active"
                    type="button"
                    data-category="coffee"
                >
                    Coffee
                </button>

                <button
                    class="category-button"
                    type="button"
                    data-category="tea"
                >
                    Tea
                </button>

                <button
                    class="category-button"
                    type="button"
                    data-category="desserts"
                >
                    Desserts
                </button>

            </div>

            <div class="catalog__grid" id="catalog-grid"></div>

            <button
                class="load-more"
                id="load-more"
                type="button"
            >
                Load more
            </button>

        </div>
    </section>

</main>

<div class="modal" id="product-modal">

    <div class="modal__overlay"></div>

    <div
        class="modal__content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
    >

        <button
            class="modal__close"
            id="modal-close"
            type="button"
            aria-label="Close modal"
        >
            ×
        </button>

        <div class="modal__image-wrapper">

            <img
                class="modal__image"
                id="modal-image"
                src=""
                alt=""
            >

        </div>

        <div class="modal__info">

            <p class="modal__category" id="modal-category"></p>

            <h2
                class="modal__title"
                id="modal-title"
            ></h2>

            <p class="modal__summary" id="modal-summary"></p>

            <p
                class="modal__description"
                id="modal-description"
            ></p>

            <div class="modal__options" id="modal-options"></div>

            <div class="modal__price-row">
                <span>Total</span>
                <div class="modal__price" id="modal-price"></div>
            </div>

        </div>

    </div>

</div>

<footer class="footer">
    <div class="container footer__container">

        <div class="footer__info">
            <a class="logo" href="index.html">
                Coffee Lab
            </a>

            <p>
                Specialty coffee for every day.
            </p>
        </div>

        <div class="footer__contacts">
            <h3>Contact</h3>

            <a href="tel:+1234567890">
                +1 234 567 890
            </a>

            <a
                href="https://maps.google.com"
                target="_blank"
                rel="noopener noreferrer"
            >
                Our location
            </a>
        </div>

        <div class="footer__social">
            <h3>Follow us</h3>

            <a
                href="https://www.instagram.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                Instagram
            </a>

            <a
                href="https://github.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                GitHub
            </a>
        </div>

    </div>

    <div class="footer__bottom">
        <p>
            © 2026 Coffee Lab
        </p>
    </div>
</footer>


<script src="js/theme.js"></script>
<script src="js/products.js"></script>
<script src="js/modal.js"></script>
<script src="js/catalog.js"></script>

</body>
</html>
